services:
  - type: web
    name: uangku-tracker
    runtime: node
    plan: free
    buildCommand: "echo 'Zero-dependency Node.js app'"
    startCommand: "node src/server.js"
    envVars:
      - key: DATA_DIR
        value: /var/data/uangku
    disk:
      name: uangku-data
      mountPath: /var/data/uangku
      sizeGB: 1
